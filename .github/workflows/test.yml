name: Test attendance
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: attendance_test
          POSTGRES_USER: attendance_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INJAZ_TEST_DATABASE_URL: postgresql://attendance_test:test-only-password@localhost:5432/attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node build.mjs
      - run: node --test test_api.mjs
        env:
          INJAZ_TEST_SSL: disable
