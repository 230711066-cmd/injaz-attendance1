services:
  - type: web
    name: injaz-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: INJAZ_HTTPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: INJAZ_SETUP_TOKEN
        generateValue: true
